<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Component</title>
  <style>
    :root {
      --color-primary: #6366f1;
      --color-primary-hover: #4f46e5;
      --color-neutral-50: #f9fafb;
      --color-neutral-100: #f3f4f6;
      --color-neutral-300: #d1d5db;
      --color-neutral-600: #4b5563;
      --color-neutral-900: #111827;
      --color-success: #22c55e;
      --radius: 12px;
      --shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --color-neutral-50: #1f2937;
        --color-neutral-100: #111827;
        --color-neutral-300: #374151;
        --color-neutral-600: #9ca3af;
        --color-neutral-900: #f9fafb;
        --shadow: 0 4px 16px rgba(0,0,0,0.4);
      }
    }

    [data-theme="dark"] {
      --color-neutral-50: #1f2937;
      --color-neutral-100: #111827;
      --color-neutral-300: #374151;
      --color-neutral-600: #9ca3af;
      --color-neutral-900: #f9fafb;
      --shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { transition: background 0.3s ease, color 0.3s ease; }
    body, .card, .theme-toggle { transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, color 0.3s ease; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--color-neutral-100);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      background: var(--color-neutral-50);
      border: 1px solid var(--color-neutral-300);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      max-width: 360px;
      width: 100%;
      overflow: hidden;
    }

    .card__image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      background: linear-gradient(135deg, #6366f1 0%, #a78bfa 100%);
    }

    .card__body {
      padding: 24px;
    }

    .card__badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-success);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }

    .card__badge::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-success);
    }

    .card__title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-neutral-900);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .card__description {
      font-size: 0.9375rem;
      color: var(--color-neutral-600);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .card__actions {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      position: relative;
      overflow: hidden;
      transition: background 0.15s, transform 0.1s;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      animation: ripple-expand 0.55s linear;
      pointer-events: none;
      background: rgba(255, 255, 255, 0.35);
    }

    .btn--ghost .ripple {
      background: rgba(99, 102, 241, 0.2);
    }

    @keyframes ripple-expand {
      to { transform: scale(4); opacity: 0; }
    }

    .btn:focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 2px;
    }

    .btn:active { transform: scale(0.97); }

    .btn--primary {
      background: var(--color-primary);
      color: #fff;
    }

    .btn--primary:hover { background: var(--color-primary-hover); }

    .btn--ghost {
      background: transparent;
      color: var(--color-primary);
      border: 2px solid var(--color-primary);
    }

    .btn--ghost:hover { background: var(--color-neutral-100); }

    .theme-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--color-neutral-300);
      background: var(--color-neutral-50);
      color: var(--color-neutral-900);
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
      overflow: hidden;
    }

    .theme-toggle:hover { border-color: var(--color-primary); }
    .theme-toggle:active { transform: scale(0.92); }
    .theme-toggle:focus-visible {
      outline: 3px solid var(--color-primary);
      outline-offset: 2px;
    }

    .theme-toggle__icon {
      display: inline-block;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
    }

    .theme-toggle.is-spinning .theme-toggle__icon {
      animation: spin-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes spin-in {
      0%   { transform: rotate(-90deg) scale(0.5); opacity: 0; }
      100% { transform: rotate(0deg)   scale(1);   opacity: 1; }
    }

    .theme-toggle::after {
      content: attr(data-tooltip);
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--color-neutral-900);
      color: var(--color-neutral-50);
      font-size: 0.75rem;
      font-weight: 500;
      white-space: nowrap;
      padding: 5px 10px;
      border-radius: 6px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .theme-toggle:hover::after {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
    <span class="theme-toggle__icon" id="themeIcon">🌙</span>
  </button>

  <article class="card" aria-label="Product card">
    <div class="card__image" role="img" aria-label="Product preview gradient"></div>
    <div class="card__body">
      <span class="card__badge">Available</span>
      <h2 class="card__title">Verdhana Design System</h2>
      <p class="card__description">
        A clean, accessible component library built for speed and consistency across every screen size.
      </p>
      <div class="card__actions">
        <button class="btn btn--primary">Get Started</button>
        <button class="btn btn--ghost">Learn More</button>
      </div>
    </div>
  </article>

  <script>
    document.querySelectorAll('.btn').forEach(btn => {
      btn.addEventListener('click', e => {
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - rect.left - size / 2}px;top:${e.clientY - rect.top - size / 2}px`;
        btn.appendChild(ripple);
        ripple.addEventListener('animationend', () => ripple.remove());
      });
    });

    const toggle = document.getElementById('themeToggle');
    const icon = document.getElementById('themeIcon');
    const root = document.documentElement;

    const stored = localStorage.getItem('theme');
    let dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(false);

    toggle.addEventListener('click', () => {
      dark = !dark;
      localStorage.setItem('theme', dark ? 'dark' : 'light');
      applyTheme(true);
    });

    function applyTheme(animate) {
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      const label = dark ? 'Switch to light mode' : 'Switch to dark mode';
      toggle.setAttribute('aria-label', label);
      toggle.setAttribute('data-tooltip', label);

      if (animate) {
        toggle.classList.remove('is-spinning');
        void toggle.offsetWidth; // force reflow to restart animation
        icon.textContent = dark ? '☀️' : '🌙';
        toggle.classList.add('is-spinning');
        toggle.addEventListener('animationend', () => toggle.classList.remove('is-spinning'), { once: true });
      } else {
        icon.textContent = dark ? '☀️' : '🌙';
      }
    }
  </script>

</body>
</html>
